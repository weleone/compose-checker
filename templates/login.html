<!DOCTYPE html>
<html lang="zh">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 - Compose Checker</title>
<style>
body{font-family:system-ui;background:#f5f5f5;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.box{background:#fff;padding:32px 40px;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.1);width:300px}
h2{margin:0 0 20px;text-align:center}
input{width:100%;padding:10px;margin:8px 0;box-sizing:border-box;border:1px solid #ddd;border-radius:4px}
button{width:100%;padding:10px;background:#1F9D55;color:#fff;border:0;border-radius:4px;cursor:pointer;font-size:15px}
.err{color:#c00;font-size:13px;text-align:center;margin-top:8px}
</style></head>
<body>
<div class="box">
<h2>Compose Checker</h2>
<form method="post">
<input name="username" placeholder="用户名" autocomplete="username">
<input name="password" type="password" placeholder="密码" autocomplete="current-password">
<button type="submit">登录</button>
</form>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
</div>
</body></html>
